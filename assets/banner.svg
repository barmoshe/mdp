<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="MDP — one source, many design-locked artifacts">
  <title>MDP: a presentation compiler for AI-written content</title>
  <defs>
    <style>
      .sans  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- flat editorial card: no shadow, no gradient (MDP design lock) -->
  <rect x="8" y="8" width="1184" height="324" rx="16" fill="#fdfcfb" stroke="#e7e5e1" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="600" y="62" class="sans" font-size="15" font-weight="500" letter-spacing="5" text-anchor="middle" fill="#8c8a83">MARKDOWN&#160;&#160;·&#160;&#160;PRESENTATION&#160;&#160;·&#160;&#160;COMPILER</text>

  <!-- wordmark -->
  <text x="600" y="176" class="serif" font-size="120" letter-spacing="2" text-anchor="middle" fill="#1c1b19">MDP</text>
  <!-- single restrained accent rule -->
  <rect x="552" y="196" width="96" height="4" rx="2" fill="#5b54d6"/>

  <!-- tagline -->
  <text x="600" y="240" class="serif" font-style="italic" font-size="30" text-anchor="middle" fill="#56544f">one source, many design-locked artifacts</text>

  <!-- form chips -->
  <g class="sans" font-size="15" font-weight="500" fill="#4f46d6">
    <g>
      <rect x="317" y="262" width="78"  height="34" rx="17" fill="#eeedfb" stroke="#b8b4ec" stroke-width="1"/>
      <text x="356" y="284" text-anchor="middle">page</text>
    </g>
    <g>
      <rect x="409" y="262" width="86"  height="34" rx="17" fill="#eeedfb" stroke="#b8b4ec" stroke-width="1"/>
      <text x="452" y="284" text-anchor="middle">slides</text>
    </g>
    <g>
      <rect x="509" y="262" width="78"  height="34" rx="17" fill="#eeedfb" stroke="#b8b4ec" stroke-width="1"/>
      <text x="548" y="284" text-anchor="middle">flyer</text>
    </g>
    <g>
      <rect x="601" y="262" width="92"  height="34" rx="17" fill="#eeedfb" stroke="#b8b4ec" stroke-width="1"/>
      <text x="647" y="284" text-anchor="middle">report</text>
    </g>
    <g>
      <rect x="707" y="262" width="80"  height="34" rx="17" fill="#eeedfb" stroke="#b8b4ec" stroke-width="1"/>
      <text x="747" y="284" text-anchor="middle">memo</text>
    </g>
    <g>
      <rect x="801" y="262" width="82"  height="34" rx="17" fill="#eeedfb" stroke="#b8b4ec" stroke-width="1"/>
      <text x="842" y="284" text-anchor="middle">letter</text>
    </g>
  </g>
</svg>
